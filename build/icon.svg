<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fe2a0"/>
      <stop offset="100%" stop-color="#2fa874"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc95e"/>
      <stop offset="100%" stop-color="#e09a2e"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a85"/>
      <stop offset="100%" stop-color="#d94a56"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="84" y="84" width="856" height="856" rx="184" ry="184" fill="none" stroke="#272d39" stroke-width="4"/>

  <!-- Meter tracks (dark slots, like the app's meter bars) -->
  <g fill="#1c212b" stroke="#272d39" stroke-width="3">
    <rect x="176" y="250" width="96" height="600" rx="30"/>
    <rect x="320" y="250" width="96" height="600" rx="30"/>
    <rect x="464" y="250" width="96" height="600" rx="30"/>
    <rect x="608" y="250" width="96" height="600" rx="30"/>
    <rect x="752" y="250" width="96" height="600" rx="30"/>
  </g>

  <!-- Meter fills, bottom-anchored; color follows the level like the app:
       green (nominal), amber (warn), red (hot). -->
  <g>
    <rect x="176" y="640" width="96" height="210" rx="30" fill="url(#green)"/>
    <rect x="320" y="490" width="96" height="360" rx="30" fill="url(#amber)"/>
    <rect x="464" y="298" width="96" height="552" rx="30" fill="url(#red)"/>
    <rect x="608" y="562" width="96" height="288" rx="30" fill="url(#green)"/>
    <rect x="752" y="400" width="96" height="450" rx="30" fill="url(#amber)"/>
  </g>

  <!-- Clip indicator above the hot (red) bar -->
  <circle cx="512" cy="272" r="13" fill="#f0616d"/>
  <circle cx="512" cy="272" r="20" fill="#f0616d" opacity="0.25"/>
</svg>
