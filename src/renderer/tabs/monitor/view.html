<!-- ── View: Monitor ─────────────────────────────────────────────── -->
<div id="view-monitor" class="view" hidden>
  <div class="monitor-setup">
    <label class="switch-label">
      <input type="checkbox" id="mon-enable" />
      <span class="switch"></span>
      <span class="switch-text">Применять</span>
    </label>
    <div class="monitor-pick">
      <span class="monitor-side l">L</span>
      <select id="mon-l-dest" class="monitor-select"></select>
    </div>
    <div class="monitor-pick">
      <span class="monitor-side r">R</span>
      <select id="mon-r-dest" class="monitor-select"></select>
    </div>
    <button id="mainlr-btn" type="button" class="mix-btn mainlr-btn">Main LR</button>
  </div>
  <div class="mix-buttons" id="mix-buttons"></div>
  <div class="ch-buttons" id="ch-buttons"></div>
  <div class="fx-buttons" id="fx-buttons"></div>
</div>
