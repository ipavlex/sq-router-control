<!-- ── View: Log ────────────────────────────────────────────────── -->
<div id="view-log" class="view" hidden>
  <div class="panel log-view">
    <div class="panel-head">
      <h2>Журнал кадров</h2>
      <div class="monitor-tools">
        <span id="update-stat" class="stat"></span>
        <button id="log-raw-toggle" class="btn ghost sm" aria-pressed="false" title="Показать сырые байты кадров (hex) вместо текста">Сырой hex</button>
        <button id="mark-log" class="btn ghost sm">Метка (M)</button>
        <button id="save-log" class="btn ghost sm">Сохранить в файл</button>
        <button id="clear-log" class="btn ghost sm">Очистить</button>
      </div>
    </div>
    <div id="log" class="log"></div>
  </div>
</div>
