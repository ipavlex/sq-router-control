<!-- ── Connection screen ─────────────────────────────────────────── -->
<section id="connect-screen" class="screen">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <!-- Mini version of the app icon: five level meters, green → amber → red. -->
      <svg viewBox="0 0 1024 1024" width="58" height="58">
        <defs>
          <linearGradient id="lg-green" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4fe2a0"/>
            <stop offset="100%" stop-color="#2fa874"/>
          </linearGradient>
          <linearGradient id="lg-amber" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffc95e"/>
            <stop offset="100%" stop-color="#e09a2e"/>
          </linearGradient>
          <linearGradient id="lg-red" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff7a85"/>
            <stop offset="100%" stop-color="#d94a56"/>
          </linearGradient>
        </defs>
        <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="#141926"/>
        <rect x="84" y="84" width="856" height="856" rx="184" ry="184" fill="none" stroke="#272d39" stroke-width="6"/>
        <g fill="#1c212b" stroke="#272d39" stroke-width="4">
          <rect x="176" y="250" width="96" height="600" rx="30"/>
          <rect x="320" y="250" width="96" height="600" rx="30"/>
          <rect x="464" y="250" width="96" height="600" rx="30"/>
          <rect x="608" y="250" width="96" height="600" rx="30"/>
          <rect x="752" y="250" width="96" height="600" rx="30"/>
        </g>
        <rect x="176" y="640" width="96" height="210" rx="30" fill="url(#lg-green)"/>
        <rect x="320" y="490" width="96" height="360" rx="30" fill="url(#lg-amber)"/>
        <rect x="464" y="298" width="96" height="552" rx="30" fill="url(#lg-red)"/>
        <rect x="608" y="562" width="96" height="288" rx="30" fill="url(#lg-green)"/>
        <rect x="752" y="400" width="96" height="450" rx="30" fill="url(#lg-amber)"/>
        <circle cx="512" cy="272" r="13" fill="#f0616d"/>
        <circle cx="512" cy="272" r="20" fill="#f0616d" opacity="0.25"/>
      </svg>
    </div>
    <div>
      <h1>SQ Router Control</h1>
      <p class="sub">Allen &amp; Heath SQ — network routing monitor</p>
    </div>
  </div>

  <div class="card">
    <label for="ip-input" class="field-label">IP-адрес пульта</label>
    <div class="ip-row">
      <input
        id="ip-input"
        class="ip-input"
        type="text"
        inputmode="decimal"
        placeholder="192.168.1.60"
        autocomplete="off"
        spellcheck="false"
      />
      <input
        id="port-input"
        class="port-input"
        type="number"
        value="51326"
        min="1"
        max="65535"
        title="TCP port (default 51326)"
      />
    </div>
    <p class="hint">
      Порт по умолчанию: <code>51326</code> (бинарный протокол SQ). Порт MIDI
      — <code>51325</code>.
    </p>

    <button id="connect-btn" type="button" class="btn primary">
      <span class="btn-label">Подключиться</span>
    </button>

    <div class="divider">
      <span>или</span>
    </div>

    <button id="demo-btn" type="button" class="btn ghost full">
      ▶ Демо-режим (без пульта)
    </button>

    <div id="connect-msg" class="msg" hidden></div>
  </div>

  <div class="recent" id="recent-row" hidden>
    <span class="recent-label">Недавние:</span>
    <div id="recent-list" class="recent-list"></div>
  </div>
</section>
