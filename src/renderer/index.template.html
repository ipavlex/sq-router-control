<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>SQ Router Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- @tab:connect -->

    <!-- ── Dashboard screen ──────────────────────────────────────────── -->
    <section id="dash-screen" class="screen" hidden>
      <header class="topbar">
        <div class="topbar-left">
          <span class="dot live"></span>
          <div>
            <div id="topbar-title" class="topbar-title">SQ</div>
            <div class="topbar-subline">
              <span id="topbar-sub" class="topbar-sub"></span>
              <span id="topbar-scene" class="topbar-scene"></span>
            </div>
          </div>
        </div>
        <div class="topbar-right">
          <button id="routing-btn" class="btn ghost active" title="Роутинг">🔊 Роутинг</button>
          <button id="monitor-btn" class="btn ghost" title="Мониторинг">🎧 Монитор</button>
          <button id="log-btn" class="btn ghost" title="Открыть журнал кадров">📋 Журнал</button>
          <button id="disconnect-btn" class="btn danger">Отключиться</button>
        </div>
      </header>

      <!-- @tab:routing -->
      <!-- @tab:log -->
      <!-- @tab:monitor -->
    </section>

    <!-- @tab:routing-modals -->

    <script src="renderer.js"></script>
  </body>
</html>
